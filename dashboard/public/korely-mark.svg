<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Korely">
  <!-- Outer pyramid outline -->
  <path d="M16 3.5 L29 27.5 L3 27.5 Z"
        fill="none"
        stroke="#3B82F6"
        stroke-width="2.4"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner pyramid, lighter blue, suggests depth -->
  <path d="M16 11 L24 27.5 L8 27.5 Z"
        fill="#3B82F6"
        fill-opacity="0.22"
        stroke="#60A5FA"
        stroke-width="1.5"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Apex glow dot -->
  <circle cx="16" cy="3.5" r="1.8" fill="#3B82F6"/>
</svg>
