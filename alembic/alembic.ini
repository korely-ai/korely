[alembic]
script_location = alembic
prepend_sys_path = .
# How prepend_sys_path is split. Without it alembic warns and falls back to
# splitting on spaces, commas and colons; with one entry, "." either way.
path_separator = os
# The URL comes from DATABASE_URL at runtime (see alembic/env.py). Deliberately
# absent here so a checked-in file can never point a migration at the wrong
# database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
